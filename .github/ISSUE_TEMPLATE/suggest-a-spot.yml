name: Suggest a spot
description: Recommend a new date-night venue for the guide
title: "[Suggestion] "
body:
  - type: input
    id: venue
    attributes:
      label: Venue name
      placeholder: e.g. The Rusty Nail
    validations:
      required: true
  - type: input
    id: town
    attributes:
      label: Town
      placeholder: e.g. Scranton
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Bars & Cocktail Lounges
        - Casino Nightlife
        - Breweries
        - Live Music
        - Comedy
        - Cinemas & Drive-Ins
        - Haunted Attractions
        - Seasonal Series & Annual Events
        - Bowling, Arcades & Mini Golf
        - Axe Throwing, Escape Rooms & Indoor Golf
        - Creative Nights
        - Afternoon Adventures
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it fits
      description: What makes it a good date night? Note the guide excludes restaurants, cafés, dessert shops, wineries, and wine bars.
      placeholder: "Late-night karaoke, open till 2am on weekends…"
    validations:
      required: true
