name: Report wrong hours
description: A venue's hours in the guide don't match reality
title: "[Wrong hours] "
body:
  - type: input
    id: venue
    attributes:
      label: Venue name
      description: Which spot has the wrong hours?
      placeholder: e.g. Beer Boys
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What's wrong
      description: What does the guide say, and what are the actual hours?
      placeholder: The guide says Wed–Sat 6pm–2am but they're actually closed Wednesdays.
    validations:
      required: true
  - type: textarea
    id: correct-hours
    attributes:
      label: Correct hours (if known)
      description: Day-by-day hours if you have them.
      placeholder: "Mon: closed, Tue: closed, Wed: 6pm–2am, ..."
